const $=s=>document.querySelector(s),views=$('#views');const store={getItem(k){try{return window.localStorage.getItem(k)}catch(e){return null}},setItem(k,v){try{window.localStorage.setItem(k,v)}catch(e){}},removeItem(k){try{window.localStorage.removeItem(k)}catch(e){}}};let user=store.getItem('storyName')||'',current='lock',route=store.getItem('storyRoute')||'',screenHistory=[],dial='',callFrom='',phoneTab='recent',navQuery='',igTab='feed';let readDM=false,readK=false;

function statusColor(dark=false){$('#status').style.color=dark?'white':'#161616'}function show(html){views.innerHTML=html;views.querySelectorAll('.screen').forEach(e=>e.classList.add('active'));statusColor(current==='call');}function go(p){if(p==='home'&&!user){nameModal();return}if(p==='home'&&current==='lock'){current='home'}else{if(current!==p)screenHistory.push(current);current=p}render()}function back(){current=screenHistory.pop()||'home';render()}function icon(a){return `<button class="appicon" onclick="go('${a[0]}')"><div class="square ${a[3]}">${a[1]==='TALK'?'<b style="font-size:14px;background:#3b2924;color:#ffe400;border-radius:14px;padding:8px 4px">TALK</b>':a[1]}</div>${a[2]}</button>`}function base(content,cls='app'){return `<section class="screen ${cls}">${content}</section>`}function top(title,backto=true,right=''){return `<div class="top">${backto?'<button class="back" onclick="back()">‹ 뒤로</button>':''}<strong>${title}</strong><span>${right}</span></div>`}function item(name,sub,act,t=''){return `<button class="item" onclick="${act}"><div class="avatar">${name.slice(0,1)}</div><div class="content"><b>${name}</b><p>${sub}</p></div><span class="time">${t}</span></button>`}function msg(text,mine=false){return `<div class="bubble ${mine?'mine':'theirs'}">${text}</div>`}function choices(opts){return `<div class="choices">${opts.map(o=>`<button class="choice" onclick="${o[1]}">${o[0]}</button>`).join('')}</div>`}function notice(app,who,message){const t=$('#toast');t.innerHTML=`<b>${app} · ${who}</b>${message}`;t.style.display='block';setTimeout(()=>t.style.display='none',4200)}

('inbox')"><div class="ring"><div>♟</div></div>${x}</div>`).join('')}</div><div style="padding:12px"><b>luckyhak29</b></div><div class="feedphoto">☾</div><div class="igfoot"><button onclick="go('inbox')">♡</button><button onclick="go('inbox')">♧</button><button onclick="go('inbox')">➤</button><p><b>luckyhak29</b> 센치해지네</p><p class="muted">댓글 보기 · ㅅㅂㅋㅋㅋㅋㅋㅋ 너 취했음?</p></div><div class="bottomnav"><button>⌂</button><button>⌕</button><button onclick="go('inbox')">➤</button><button onclick="go('profile')">◉</button></div>`,'app ig')}else if(current==='inbox'){h=base(`${top('메시지')}<div class="search">⌕ 검색</div><div class="list">${item('luckyhak29','누나 내일 시간 있어요?',"go('dm')",'지금')}${item('ehdgus2','사진 보내줘 ㅋㅋ',"go('dm2')",'어제')}${item('sxjjin_','좋아요!',"go('dm2')",'월요일')}</div>`)}else if(current==='dm'||current==='dm2'){let main=current==='dm';h=base(`${top(main?'luckyhak29':'ehdgus2')}<div class="bubblearea">${main?msg('누나 뭐해요')+msg('내일 시간 있어요?')+msg('나랑 데이트할래요? ㅎㅎ')+(route?msg(route==='woonha'?'데이트 맞지 ㅎㅎ 좋아 만나자':'아 내일 카공하기로 했어... 다음에 만나자 운학아 ㅜㅜ 미안',true)+msg(route==='woonha'?'그럼 내일 봐요 누나 ㅎㅎ':'아쉽다 ㅜㅜ 다음에 봐요')+(route==='donghyun'?msg('누나')+msg('전화 받아요 ㅋㅋㅋ'):''):''):msg('사진 보내줘 ㅋㅋ')}</div>${main&&!route?choices([['데이트 맞지 ㅎㅎ 좋아 만나자',"choose('woonha','instagram')"],['아 내일 카공하기로 했어... 다음에 만나자 운학아 ㅜㅜ 미안',"choose('donghyun','instagram')"]]):''}`,'app dm');if(main)readDM=true;}else if(current==='profile'){h=base(`${top('luckyhak29')}<div style="padding:25px;text-align:center"><div class="avatar" style="margin:auto;width:85px;height:85px">운</div><h2>luckyhak29</h2><p>김운학 ☀️</p><button class="primary" onclick="go('dm')">메시지 보내기</button></div><div class="photo-grid"><div>🌙</div><div>🎧</div><div>🌷</div></div>`)}else if(current==='phone'){h=base(`<div class="dial">${dial}</div><div class="phonepad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map((n,i)=>`<button class="key" onclick="dial+='${n}';render()">${n}<small>${['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ','','+',''][i]}</small></button>`).join('')}</div><button class="callbtn" onclick="startCall('김운학')">☎</button>${phoneNav('keypad')}`)}else if(current==='recent'||current==='contacts'){let list=current==='recent'?recent:contacts;h=base(`${top(current==='recent'?'최근 통화':'연락처',false)}<div class="search">⌕ 검색</div><div class="list">${list.map((n,i)=>item(n,current==='recent'?'↗ 대한민국':'휴대전화',`startCall('${n}')`,i<1?'오후 12:13':i<4?'어제':'수요일')).join('')}</div>${phoneNav(current)}`)}else if(current==='call'){h=base(`<div style="padding-top:150px;text-align:center;color:white"><div style="font-size:34px">${callFrom}</div><p>통화 중...</p><div style="font-size:75px;margin:80px">◉</div><button class="callbtn" style="background:#ed5555" onclick="finishCall()">☎</button><p>통화 종료</p></div>`,'screen');h=h.replace('class="screen screen"','class="screen"');}else if(current==='naver'){h=base(`${top('NAVER',false)}<div style="padding:16px"><div class="search" style="background:#fff;border:2px solid #04c75a;color:#222" onclick="go('searchResults')">⌕　${navQuery||'검색어를 입력하세요'}</div><h3>최근 검색어</h3>${['썸남 심리','알바 같이하는 사람과 썸','ENFP 남자','남자의 호감 행동'].map((q,i)=>`<button class="item" onclick="${i===0?"navQuery='썸남 심리';go('searchResults')":"notice('네이버','최근 검색어','이 검색어는 열 수 없어요')"}"><span style="color:#aaa">◷</span><b>${q}</b></button>`).join('')}</div>`)}else if(current==='searchResults'){h=base(`${top('검색 결과')}<div class="search">⌕ 썸남 심리</div><div style="padding:20px;line-height:1.8"><b style="color:#04c75a">연애 · 심리</b><h3>썸남이 나를 좋아할 때 보이는 행동</h3><p>별것 아닌 일에도 연락하고, 둘만의 약속을 잡으려 하거나 사소한 이야기를 기억한다면 호감의 신호일 수 있어요.</p><hr><h3>자꾸 연락하는 남자, 관심일까?</h3><p>상대방의 행동만큼 중요한 건 내 마음이 어디로 향하고 있는지예요.</p></div>`)}else if(current==='memo'){h=base(`${top('메모',false,'＋')}<div class="note"><b>오늘의 생각 💭</b><br>왜 둘 다 나한테 잘해 주는 거지?<br>운학이는 자꾸 장난치고…<br>동현이는 은근히 다정하다.<br><br>내일은 무슨 일이 생기려나.</div><div class="note"><b>해야 할 일</b><br>☐ 카페 알바<br>☐ 과제 정리<br>☐ 답장하기</div>`)}else if(current==='photos'||current==='camera'){h=base(`${top('사진',false)}<div class="photo-grid">${['☕','📖','🌙','🧸','🌷','📸','🍰','🌆','💌'].map(x=>`<div onclick="notice('사진','추억','${x} 오늘의 한 장')">${x}</div>`).join('')}</div>`)}else if(current==='messages'){h=base(`${top('메시지',false,'✎')}<div class="list">${item('엄마','언제 와?',"go('sms')",'어제')}${item('김운학','내일 봐요 ㅎㅎ',"go('sms')",'월요일')}</div>`)}else if(current==='sms'){h=base(`${top('메시지')}<div class="bubblearea">${msg('언제 와?')}${msg('금방 가!',true)}</div>`)}else if(current==='music'){h=base(`${top('음악',false)}<div style="padding:40px;text-align:center"><div style="background:linear-gradient(135deg,#ffafc0,#9c7dcc);height:260px;border-radius:20px;display:grid;place-items:center;font-size:85px">♫</div><h2>좋아하는 노래</h2><p>오늘도 너를 생각해</p><button class="primary" onclick="notice('음악','재생 중','♪')">▶ 재생</button></div>`)}else if(current==='settings'){h=base(`${top('설정',false)}<div class="list">${item(user||'사용자','Apple 계정, iCloud',"nameModal()")}${item('배경화면','기본 배경',"go('home')")}${item('스토리 초기화','선택과 진행 상황 지우기',"resetGame()")}</div>`)}else if(current==='ending'){let w=route==='woonha';h=base(`<div><div style="font-size:58px">${w?'☀️':'☕'}</div><h1>${w?'김운학':'김동현'} ENDING</h1><p>${w?'다음날 운학이와 나는 평범한 데이트를 했고 집을 데려다주는 길에 고백했다.':'다음날 동현이와 나는 카공을 하며 썸을 탔고, 얼마 안 지나 동현이가 고백했다.'}</p><button class="primary" onclick="resetGame()">처음부터 다시 하기</button><button class="primary" style="background:#fff;color:#333" onclick="go('home')">홈화면으로</button></div>`,'end')}else h=base(`${top('앱')}<p style="padding:20px">준비 중이에요</p>`);show(h);if(current==='call'){$('.screen').style.background='#242633';statusColor(true)} }
function phoneNav(which){return `<div class="bottomnav">${[['☆','favorites'],['◷','recent'],['♟','contacts'],['▦','phone'],['◎','voicemail']].map(([x,p])=>`<button class="${which===p?'selected':''}" onclick="go('${p==='favorites'||p==='voicemail'?'recent':p}')">${x}</button>`).join('')}</div>`}
function choose(r,source){if(route)return;route=r;store.setItem('storyRoute',r);render();setTimeout(()=>{notice('전화',r==='woonha'?'김운학':'김동현','전화가 오고 있어요… 탭해서 받기');const t=$('#toast');t.onclick=()=>{t.style.display='none';startCall(r==='woonha'?'김운학':'김동현')};},700)}function startCall(n){if(n!=='김운학'&&n!=='김동현'){notice('전화',n,'최근 통화 내역만 확인할 수 있어요');return}callFrom=n;go('call')}function finishCall(){go('home');if(route){setTimeout(()=>{current='ending';render()},700)}else notice('전화',callFrom,'통화가 종료되었어요')}
function nameModal(){const el=document.createElement('div');el.className='overlay';el.innerHTML=`<div class="modal"><div style="font-size:38px">💌</div><h2>사용자 이름을 입력하세요</h2><p class="muted">이야기 속에서 불릴 이름이에요.</p><input id="username" placeholder="이름" value="${user}" maxlength="15"><button class="primary" id="begin">시작하기</button></div>`;$('#shell').append(el);el.querySelector('#begin').onclick=()=>{user=el.querySelector('input').value.trim()||'다현';store.setItem('storyName',user);el.remove();current='lock';render()};}function resetGame(){if(!confirm('스토리를 처음부터 다시 시작할까?'))return;route='';store.removeItem('storyRoute');readDM=readK=false;current='lock';screenHistory=[];render()}
setInterval(()=>{let d=new Date();$('#clock').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`},10000);try{render();if(!user)nameModal()}catch(err){document.getElementById('views').innerHTML='<section class="screen wall active" style="padding:130px 25px;text-align:center"><h2>화면을 불러오지 못했어요</h2><p id="errormsg"></p><button onclick="location.reload()">다시 시도</button></section>';document.getElementById('errormsg').textContent=String(err)}let startY=0;$('#shell').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});$('#shell').addEventListener('touchend',e=>{if(current==='lock'&&startY-e.changedTouches[0].clientY>60)go('home')},{passive:true});
</script></body></html>
