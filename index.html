function ig(){let stories=[['jae','IMG_1208(1).jpeg'],['sung','DDC04C93-4CED-4B5C-9944-3976B5D20224.jpeg'],['dong','90098DDB-93D7-4BEF-A28D-DC6F81491E19.jpeg'],['tae','89E094B1-E4AD-4AE7-A98A-23D1B4618946.jpeg']];if(S.woonStory)stories.unshift(['woon','218588C7-5BC7-4E59-A1F6-5A76726E6B3B.jpeg']);let feeds=['woon','dong','hyuk'].flatMap(k=>profiles[k].posts.map((p,i)=>({k,p,i}))).reverse();screen(`<div class="view">${bar('Instagram',"set('home')",`<button class="appbtn" style="font-size:24px" onclick="set('app','ig-dms')">♡</button>`)}<div class="scroll"><div class="stories">${stories.map(([k,f])=>`<button class="appbtn" onclick="openStory('${k}')"><div class="storyavatar">${photo(profiles[k].avatar||f,56)}</div><div class="storylabel">${profiles[k].name}</div></button>`).join('')}</div>${feeds.map(({k,p,i})=>`<div class="post"><div class="posthead" onclick="openProfile('${k}')">${photo(profiles[k].avatar,31)} ${profiles[k].handle} <span class="spacer"></span>⋯</div><img class="postimage" src="${img(p.pics[0])}" onclick="openPost('${k}',${i})"><div class="postfoot">♡　♧　➤<br><b>${profiles[k].handle}</b> ${esc(p.cap)} ${p.pics.length>1?' · 사진 여러 장':''}<br><span class="small">${p.old?'몇 년 전':'최근 게시물'}</span></div></div>`).join('')}</div><div class="ig-tabs"><button class="appbtn" onclick="set('app','ig')">⌂</button><button class="appbtn" onclick="set('app','ig-search')">⌕</button><button class="appbtn" onclick="set('app','ig-dms')">♡</button><button class="appbtn" onclick="set('home')">◉</button></div></div>`)}
function openPost(k,i){let p=profiles[k].posts[i];S.post={k,i,slide:0};set('app','ig-post')}
function postView(){let {k,i,slide}=S.post,p=profiles[k].posts[i];screen(`<div class="view">${bar('게시물',"set('app','ig')")}<div class="posthead" onclick="openProfile('${k}')">${photo(profiles[k].avatar,32)}${profiles[k].handle}</div><div class="scroll"><img class="postimage" src="${img(p.pics[slide])}">${p.pics.length>1?`<div class="center pad"><button onclick="postSlide(-1)">‹ 이전</button>　${slide+1}/${p.pics.length}　<button onclick="postSlide(1)">다음 ›</button></div>`:''}<div class="postfoot">♡　♧　➤<br><b>${profiles[k].handle}</b> ${esc(p.cap)}${p.old?'<p class="small">댓글 · ㅅㅂㅋㅋㅋㅋㅋㅋㅋㅋ너취했음?</p>':''}</div></div></div>`)}function postSlide(n){S.post.slide=(S.post.slide+n+profiles[S.post.k].posts[S.post.i].pics.length)%profiles[S.post.k].posts[S.post.i].pics.length;postView()}
function openProfile(k){S.profile=k;set('profile','ig',k)}function profile(){let k=S.profile||S.thread,p=profiles[k];screen(`<div class="view">${bar(p.handle,"set('app','ig')")}<div class="scroll"><div class="profilehead"><div class="row">${photo(p.avatar,84)}<div class="spacer center"><b>${p.posts.length}</b><div class="small">게시물</div></div><div class="spacer center"><b>—</b><div class="small">팔로워</div></div><div class="spacer center"><b>—</b><div class="small">팔로잉</div></div></div><p><b>${p.name}</b></p><button class="choice" style="text-align:center" onclick="openDm('${k}')">메시지</button></div><div class="profilegrid">${p.posts.flatMap((post,i)=>post.pics.map(f=>`<img src="${img(f)}" onclick="openPost('${k}',${i})">`)).join('')}</div></div></div>`)}
function dmList(){const ids=['woon','dong','min','dom','sung','jae','hyuk','yewon'];screen(`<div class="view">${bar('메시지',"set('app','ig')")}<div class="scroll">${ids.map(k=>`<div class="listrow" onclick="openDm('${k}')">${photo(profiles[k].avatar,53)}<div style="flex:1"><b>${profiles[k].name}</b><div class="small">${(S.dm[k]||histories[k]||[]).slice(-1)[0]?.[1]||'메시지'}</div></div><span class="muted">›</span></div>`).join('')}</div></div>`)}
function openDm(k){S.thread=k;S.app='ig';S.screen='dm';S.dm[k]??=(histories[k]||[]).map(([type,t])=>[type,nameText(t)]);if(k==='woon'&&S.minEvent>=2&&!S.woonStarted){S.woonStarted=true;append('woon','t','누나ㅏㅏㅏ')}if(k==='min'&&S.minEvent===1){S.minEvent=2;append('min','t','야');append('min','t',S.name+'아')}if(!S.friendsSeen.includes(k)&&k!=='woon'&&k!=='min'){S.friendsSeen.push(k);if(S.friendsSeen.length>=5&&S.minEvent===0){S.minEvent=1;setTimeout(()=>toast('Instagram','민지','야 · '+S.name+'아',()=>openDm('min')),800)}}save();render()}
function append(k,type,t){S.dm[k]??=[];S.dm[k].push([type,nameText(t)]);save()}
function dm(){let k=S.thread,p=profiles[k],msgs=S.dm[k]||[],steps=S.steps[k]||0;let blocked=['yewon','min'].includes(k)&&!(k==='min'&&S.minEvent===2);let showChoices=k==='woon'&&S.woonDone&&!S.route;let bubbles=msgs.map(([type,t])=>type==='photo'?`<div class="bubble theirs" style="color:#888;border:1px solid #ddd">▧ 사진 · 볼 수 없는 사진</div>`:`<div class="bubble ${type==='m'?'mine':'theirs'}">${esc(t)}</div>`).join('');screen(`<div class="view">${bar(p.name,"set('app','ig-dms')",`<button class="appbtn" onclick="openProfile('${k}')">ⓘ</button>`)}<div class="scroll" id="msgscroll"><div class="messages">${bubbles}${showChoices?`<div class="notice">내일 누구와 만날까?</div><button class="choice" onclick="choose('woon')">1. 데이트 맞지 ㅎㅎ 좋아 만나자</button><button class="choice" onclick="choose('dong')">2. 아 내일 카공하기로 했어... 다음에 만나자 운학아 ㅜㅜ 미안</button>`:''}</div></div>${!blocked&&!showChoices&&!S.route?`<form class="composer" onsubmit="sendDm(event)"><input id="msginput" autocomplete="off" placeholder="메시지 보내기..."><button class="send">전송</button></form>`:S.route?'<div class="notice">대화가 종료되었어요.</div>':'<div class="notice">새 메시지를 보낼 수 없어요.</div>'}</div>`);let m=$('#msgscroll');m.scrollTop=m.scrollHeight}
function sendDm(e){e.preventDefault();let k=S.thread,field=$('#msginput'),t=field.value.trim();if(!t)return;append(k,'m',t);field.value='';if(k==='min'&&(S.minEvent===2||S.minEvent===3)){let n=S.steps.min||0;if(n===0){append(k,'t','아니...');append(k,'t','김운학 스토리 뭐야?');S.woonStory=true;S.steps.min=1;save();toast('Instagram','김운학','새 스토리가 올라왔어요',()=>openStory('woon'))}else if(n===2){['일단 내가 자연스럽게 알아보께','기다료바'].forEach(x=>append(k,'t',x));S.steps.min=3}render();return}if(k==='woon'){let n=S.steps.woon||0;let lines=scripts.woon[n+1];if(lines){lines.forEach(x=>append(k,'t',x));S.steps.woon=n+1;if(n+1===8){S.woonDone=true;setTimeout(()=>{if(!S.route){S.dongKakao=true;save();toast('카카오톡','김동현','내일 같이 카공할래?',()=>openKakao('dong'))}},1100)}}}else{let n=S.steps[k]||0;let lines=scripts[k]?.[n];if(lines){lines.forEach(x=>append(k,'t',x));S.steps[k]=n+1}}save();render()}
function toast(app,who,msg,action){$('#toastbox').innerHTML=`<div class="toast" id="alert" onclick="${action?'tapToast()':''}"><div class="logo">${app==='카카오톡'?'TALK':'◎'}</div><div><strong>${esc(app)} · ${esc(who)}</strong><p>${esc(msg)}</p></div></div>`;window.toastAction=action;setTimeout(()=>{let el=$('#alert');if(el)el.remove()},6500)}function tapToast(){let f=window.toastAction;$('#toastbox').innerHTML='';if(f)f()}
const storySets={jae:[{file:'IMG_1208(1).jpeg',time:'몇 시간 전',text:'ㅋㅋ'}],sung:[{file:'DDC04C93-4CED-4B5C-9944-3976B5D20224.jpeg',time:'5시간 전',text:'일본 좋네요 ㅎㅎ'}],dong:[{video:VIDEO,time:'1시간 전',text:''},{file:'90098DDB-93D7-4BEF-A28D-DC6F81491E19.jpeg',time:'25분 전',text:'ㅂㄱㅅㄷ'}],tae:[{file:'89E094B1-E4AD-4AE7-A98A-23D1B4618946.jpeg',time:'오후 9:55',text:'이런젤리안먹젤리'}],woon:[{file:'218588C7-5BC7-4E59-A1F6-5A76726E6B3B.jpeg',time:'방금',text:'헤드셋 잘 낄게요 누나😁😁\n@mizoodlqslek'}]};
function openStory(k){S.storyKey=k;S.storyIndex=0;set('story','ig',k)}function story(){let k=S.storyKey,i=S.storyIndex,ss=storySets[k],s=ss[i];screen(`<div class="igstory">${s.video?`<video class="storymedia" src="${s.video}" autoplay playsinline muted controls></video>`:`<img class="storymedia" src="${img(s.file)}">`}<div class="storyshade"></div><div class="storytop"><div class="progress">${ss.map((_,j)=>`<span class="${j<=i?'done':''}"></span>`).join('')}</div><div class="row" style="padding-top:12px">${photo(profiles[k].avatar,34)}<b>${profiles[k].handle}</b><span class="small" style="color:white">${s.time}</span><button class="storyclose" onclick="closeStory()">×</button></div></div><button class="storynav left" onclick="storyStep(-1)"></button><button class="storynav right" onclick="storyStep(1)"></button><div class="storytext">${esc(s.text).replaceAll('\n','<br>')}</div></div>`)}function storyStep(n){let j=S.storyIndex+n;if(j<0)return;if(j>=storySets[S.storyKey].length)return closeStory();S.storyIndex=j;save();render()}function closeStory(){if(S.storyKey==='woon'&&S.minEvent===2){['아니 저 언니','운학이랑 전에 같이 알바했던?','언니인데','뭐지...'].forEach(x=>append('min','t',x));S.steps.min=2;S.minEvent=3;save();toast('Instagram','민지','아니 저 언니...',()=>openDm('min'))}set('app','ig')}
function naver(){if(S.navSearch)return naverResults();screen(`<div class="view">${bar('NAVER',"set('home')")}<div class="searchbar" style="color:#aaa">⌕　검색어를 입력하세요 <span class="spacer"></span><b style="color:#03c75a">N</b></div><div class="pad"><b>최근 검색어</b></div>${['썸남 심리','알바 같이하는 사람과 썸','ENFP 남자','남자의 호감 행동'].map((t,i)=>`<div class="listrow" onclick="${i===0?'S.navSearch=true;save();render()':''}"><span class="muted">◷</span>${t}<span class="spacer"></span>${i===0?'›':''}</div>`).join('')}</div>`)}
function naverResults(){let q=[['썸남이 연락은 잘하는데 약속을 안 잡아요','연락한 지 3주 정도 됐는데 매일 연락하면서 만나자는 말은 안 해요. 무슨 심리인가요?'],['남자가 관심 없는데도 질투할 수 있나요?','저한테 관심 없는 줄 알았는데 다른 남자 얘기만 하면 반응이 달라져요.'],['썸남이 갑자기 답장이 느려졌어요 ㅠㅠ','원래는 10분 안에 답장했는데 요즘은 몇 시간씩 걸려요. 마음이 식은 걸까요?'],['썸타는 사이에서 먼저 고백하면 부담스러울까요?','서로 호감은 있는 것 같은데 확신이 없어요. 여자가 먼저 고백해도 괜찮나요?'],['썸남이 다른 여자한테도 친절한데요','원래 성격이 다정한 사람이라 저한테만 특별한 건지 모르겠어요.']];screen(`<div class="view">${bar('썸남 심리',"S.navSearch=false;save();render()",'<b style="color:#03c75a">N</b>')}<div class="scroll"><div class="pad" style="color:#03a94e">통합　　지식iN　　VIEW</div><h3 style="margin:10px 20px">지식iN</h3>${q.map(([title,desc],i)=>`<div class="naverresult"><div class="link ${i===0||i===2?'seen':''}">${title}</div><p style="font-size:12px;color:#666">${desc}</p><span style="font-size:11px;color:#03a94e">지식iN · 연애, 결혼</span></div>`).join('')}</div></div>`)}
function kakao(){let contacts=[['dong','김동현'],['mom','엄마'],['friend','하연언니']];screen(`<div class="view" style="background:#fff">${bar('채팅',"set('home')")}<div class="scroll">${contacts.map(([k,n])=>`<div class="listrow" onclick="openKakao('${k}')"><div class="circle" style="width:48px;height:48px;background:#fee500;display:grid;place-items:center">${k==='dong'?'🐶':'👤'}</div><div><b>${n}</b><div class="small">${k==='dong'?(S.dongKakao?'내일 같이 카공할래?':''):''}</div></div></div>`).join('')}</div><div class="notice" style="background:#fee500;color:#333">카카오톡</div></div>`)}function openKakao(k){S.thread=k;set('app','kakao-chat',k)}function kakaoChat(){let k=S.thread;screen(`<div class="view" style="background:#b2c7d9">${bar(k==='dong'?'김동현':k==='mom'?'엄마':'하연언니',"set('app','kakao')")}<div class="scroll" id="msgscroll"><div class="messages">${k==='dong'&&S.dongKakao?`<div class="bubble theirs" style="background:white">내일 같이 카공할래?</div>${S.route?'':`<button class="choice" onclick="choose('dong')">1. 그랭 ㅎㅎ</button><button class="choice" onclick="choose('woon')">2. 아 나 내일은 약속이 있어.. ㅜㅜ 미안 다음에 같이 하자 ㅎㅎ</button>`}`:''}</div></div>${!S.dongKakao?'<div class="notice">아직 새 메시지가 없어요.</div>':''}</div>`)}
function choose(k){if(S.route)return;S.route=k;save();if(k==='dong'){S.dongKakao=true;append('woon','m','아 내일 카공하기로 했어... 다음에 만나자 운학아 ㅜㅜ 미안')}else{append('woon','m','데이트 맞지 ㅎㅎ 좋아 만나자')}S.callAttempt=0;setTimeout(()=>set('call','',k),700);render()}
function call(){let k=S.route,p=profiles[k],inCall=S.callAttempt===-1;screen(`<div class="call"><div class="small" style="color:#ddd">${inCall?'통화 중':'수신 전화...'}</div><div class="name">${p.name}</div><div class="small" style="color:#ccc">휴대전화</div><div class="calltext">${inCall?esc(nameText(endingCalls[k][Math.min(S.callLine,endingCalls[k].length-1)])):''}</div><div class="callbuttons">${inCall?`<button class="callbutton" style="background:#e84c50" onclick="finishCall()">☎</button>`:`<div><button class="callbutton" style="background:#e84c50" onclick="rejectCall()">✕</button><p>거절</p></div><div><button class="callbutton" style="background:#35c765" onclick="answerCall()">☎</button><p>응답</p></div>`}</div></div>`)}let callTimer=null;function rejectCall(){S.callAttempt++;save();let k=S.route;if(k==='dong'){S.dongKakao=true;toast('카카오톡','김동현','응? 왜 안받아',null)}else{append('woon','t','누나');append('woon','t','전화 받아요 ㅋㅋㅋ');toast('Instagram','김운학','전화 받아요 ㅋㅋㅋ',null)}setTimeout(()=>{if(S.screen==='call'&&S.callAttempt!==-1)render()},2000)}function answerCall(){S.callAttempt=-1;S.callLine=0;save();render();clearInterval(callTimer);callTimer=setInterval(()=>{if(S.screen!=='call'||S.callAttempt!==-1){clearInterval(callTimer);return}S.callLine++;if(S.callLine>=endingCalls[S.route].length){clearInterval(callTimer);setTimeout(finishCall,1600)}else{save();render()}},2000)}function finishCall(){clearInterval(callTimer);set('ending')}
function ending(){let k=S.route;screen(`<div class="ending fade"><div style="font-size:65px">♡</div><div style="font-size:13px;letter-spacing:4px">THE END</div><h1>${k==='dong'?'김동현':'김운학'} ENDING</h1><p>${k==='dong'?'다음날 동현이와 나는 카공을 하며 썸을 탔고,<br>얼마 안 지나 동현이가 고백했다.':'다음날 운학이와 나는 평범한 데이트를 했고<br>집을 데려다주는 길에 고백했다.'}</p><button class="pinkbutton" onclick="restart()">처음부터 다시 하기</button></div>`)}function restart(){if(!confirm('처음부터 다시 시작할까?'))return;localStorage.removeItem('midnight-v2');S=initial();render()}
function phoneApp(){if(S.phoneTab==='keypad')return keypad();let contacts=['엄마','아빠','사장님','박성호','이상혁','명재현','한동민','김동현','김운학','삼촌','이모','할머니','할아버지','이예원','다윤이','하연언니','김채연'];screen(`<div class="view">${bar('전화',"set('home')")}<div class="scroll"><h1 class="title">${S.phoneTab==='recent'?'최근 통화':'연락처'}</h1>${(S.phoneTab==='recent'?['김운학','김동현','엄마']:contacts).map(n=>`<div class="listrow" onclick="phoneContact('${n}')"><span style="color:#8c8c91">◉</span>${n}<span class="spacer"></span><span style="color:#3994f8">ⓘ</span></div>`).join('')}</div><div class="ig-tabs"><button class="appbtn" onclick="S.phoneTab='recent';render()">최근</button><button class="appbtn" onclick="S.phoneTab='contacts';render()">연락처</button><button class="appbtn" onclick="S.phoneTab='keypad';render()">키패드</button></div></div>`)}function phoneContact(n){if(n==='김운학')toast('전화',n,'통화 기록',null);else toast('전화',n,'연락처',null)}function keypad(){screen(`<div class="view">${bar('키패드',"S.phoneTab='contacts';render()")}<div style="text-align:center;font-size:27px;min-height:60px;padding-top:20px" id="dial"></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button onclick="dial('${n}')">${n}</button>`).join('')}</div><button style="margin:auto;background:#35c764;color:white;border:0;border-radius:50%;width:70px;height:70px;font-size:30px" onclick="toast('전화','키패드','연결할 수 없는 번호예요',null)">☎</button><div style="height:60px"></div></div>`)}let digits='';function dial(n){digits+=n;$('#dial').textContent=digits}
function calendar(){let d=['일','월','화','수','목','금','토'];screen(`<div class="view">${bar('캘린더',"set('home')")}<h1 class="title">2026년 10월</h1><div class="calgrid">${d.map(x=>`<b>${x}</b>`).join('')}${Array.from({length:35},(_,i)=>`<span class="${i===27?'today':''}">${i<4||i>34?'':i-3}</span>`).join('')}</div><div class="pad"><h3>일정</h3><p class="small">예정된 일정이 없습니다.</p></div></div>`)}function music(){screen(`<div class="view dark">${bar('음악',"set('home')")}<div class="musicart">♫</div><div class="pad"><h2>미워 (Ego)</h2><p>Crush</p><div style="height:3px;background:#666;margin:28px 0"></div><div class="center"><button class="appbtn" style="color:white;font-size:38px" onclick="S.music=!S.music;render()">${S.music?'Ⅱ':'▶'}</button></div><p class="small center">재생 화면 · 실제 음원은 포함되지 않아요</p></div></div>`)}function sms(){screen(`<div class="view">${bar('메시지',"set('home')")}<h1 class="title">메시지</h1><div class="scroll">${['엄마','아빠','사장님'].map(n=>`<div class="listrow"><div class="circle" style="width:43px;height:43px;display:grid;place-items:center">👤</div><b>${n}</b></div>`).join('')}</div></div>`)}
const baseRender=render;render=function(){if(S.screen==='app'&&S.app==='ig-dms')return dmList();if(S.screen==='app'&&S.app==='ig-post')return postView();if(S.screen==='app'&&S.app==='ig-search')return screen(`<div class="view">${bar('검색',"set('app','ig')")}<div class="scroll">${Object.keys(profiles).map(k=>`<div class="listrow" onclick="openProfile('${k}')">${photo(profiles[k].avatar,40)}<b>${profiles[k].name}</b><span class="small">${profiles[k].handle}</span></div>`).join('')}</div></div>`);if(S.screen==='app'&&S.app==='kakao-chat')return kakaoChat();return baseRender()};setInterval(()=>{$('#clock').textContent='10:09'},30000);render();
</script></body></html>
