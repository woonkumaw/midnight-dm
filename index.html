
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>새벽 2시, 너에게 온 DM</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Arial",sans-serif;background:#fff;color:#161616}
#start{position:fixed;inset:0;background:#fff;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
h1{font-size:27px;line-height:1.5}
input{padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;width:100%;max-width:300px;text-align:center}
button{cursor:pointer;font-size:15px}
.mainbtn{margin-top:18px;background:#222;color:white;border:0;border-radius:12px;padding:15px 35px}
header{height:75px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;padding:15px;background:white}
.avatar{width:43px;height:43px;border-radius:50%;background:#eee;display:grid;place-items:center;font-size:23px}
.name{font-weight:700}
.status{font-size:11px;color:#888;margin-top:4px}
#chat{height:calc(100dvh - 145px);overflow-y:auto;padding:20px 15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:12px 15px;border-radius:20px;line-height:1.5;font-size:15px;animation:pop .2s ease}
.other{align-self:flex-start;border:1px solid #e5e5e5;background:#fff}
.me{align-self:flex-end;background:#efefef}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
footer{height:70px;border-top:1px solid #eee;display:flex;align-items:center;justify-content:center;padding:10px}
#next{width:100%;height:45px;border:1px solid #ddd;border-radius:25px;background:white;color:#777}
#choices{display:none;position:absolute;bottom:75px;left:12px;right:12px;background:white;padding:15px;border:1px solid #eee;border-radius:17px;box-shadow:0 4px 20px #0001}
.choice{width:100%;padding:13px;background:#fafafa;border:1px solid #ddd;border-radius:12px;margin:5px 0}
</style>
</head>
<body>
<div id="start">
<div style="font-size:45px">💌</div>
<h1>새벽 2시,<br>너에게 온 DM</h1>
<p style="color:#888">김운학 × 당신<br>알바 동료에서 시작된 이야기</p>
<input id="player" placeholder="당신의 이름을 입력하세요" maxlength="15">
<button class="mainbtn" onclick="begin()">스토리 시작하기 →</button>
</div>

<header>
<span style="font-size:25px">‹</span>
<div class="avatar">🐶</div>
<div><div class="name">woonhak_</div><div class="status">Instagram · 활동 중</div></div>
<div style="margin-left:auto;font-size:23px">♡</div>
</header>

<main id="chat"></main>
<div id="choices"></div>
<footer><button id="next" onclick="advance()">화면을 눌러 대화 계속하기 ♡</button></footer>

<script>
let player="",step=0,waiting=false,ended=false;
const chat=document.getElementById("chat");
const choices=document.getElementById("choices");
const next=document.getElementById("next");

function add(t,who="other"){
let d=document.createElement("div");
d.className="msg "+who;
d.textContent=t;
chat.appendChild(d);
chat.scrollTop=chat.scrollHeight;
}
function begin(){
player=document.getElementById("player").value.trim();
if(!player){alert("이름을 입력해줘!");return}
document.getElementById("start").style.display="none";
advance();
}
const story=[
["other","야"],
["other","안 자?"],
["other","아니 근데 너 오늘"],
["other","나한테 왜 그랬어 ㅋㅋㅋㅋ"],
["me","내가 뭘?"],
["other","마감할 때"],
["other","내 손 잡았잖아"],
["other","기억 안 나?"],
["choice",["아 그거 실수였어 ㅋㅋ","왜? 설렜어?","기억나는데? ㅎㅎ"]],
["other","근데 나"],
["other","오늘 집 가면서 계속 너 생각났어"],
["other","아 이거 좀 오글거리나"],
["other","ㅋㅋㅋㅋㅋㅋ"],
["choice",["나도 네 생각했는데","너 원래 이런 말 잘해?","그래서 나 좋아해?"]],
["other","아 진짜"],
["other","너 때문에 잠 못 자겠다"],
["other","내일 알바 같이 하잖아"],
["other","끝나고 나랑 어디 좀 갈래?"],
["choice",["좋아. 데이트야?","어디 가는데?","싫다면? ㅋㅋ"]],
["other","그럼 내일 봐"],
["other","잘 자"],
["other","그리고"],
["other","좋아해. 진짜로."]
];
function advance(){
if(waiting||ended)return;
if(step>=story.length){
ended=true;
next.textContent="처음부터 다시 하기 ↻";
next.onclick=()=>location.reload();
return;
}
let [type,value]=story[step++];
if(type==="choice"){
waiting=true;
choices.innerHTML="<div style='text-align:center;color:#888;margin-bottom:8px'>답장을 선택해줘 ♡</div>";
value.forEach((v,i)=>{
let b=document.createElement("button");
b.className="choice";
b.textContent=v;
b.onclick=()=>choose(step,i,v);
choices.appendChild(b);
});
choices.style.display="block";
next.textContent="답장을 선택해줘 ♡";
}else{
let text=value.replaceAll("{name}",player);
add(text,type);
if(step===1)add(player+"아, 지금 뭐 해?");
}
}
function choose(at,i,value){
choices.style.display="none";
waiting=false;
add(value,"me");
if(at===9){
add(i===0?"실수였다고? 난 좀 설렜는데 ㅋㅋ":i===1?"어. 엄청. 됐냐? ㅋㅋ":"아 그럼 일부러 잡은 거야?");
}
if(at===14){
add(i===0?"진짜? 나 지금 웃고 있는데":i===1?"아니 너한테만 이러는데":"응. 좋아해. 많이.");
}
if(at===19){
add(i===0?"응 데이트. 정식으로 신청할게":i===1?"우리 둘이 맛있는 거 먹으러":"그럼 나 좀 슬플 것 같은데 ㅋㅋ");
}
next.textContent="화면을 눌러 대화 계속하기 ♡";
}
</script>
</body>
</html>
