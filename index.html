ay:flex;gap:15px;overflow:auto;padding:12px 15px}.story{text-align:center;font-size:11px;flex:0 0 65px}.ring{width:63px;height:63px;border:3px solid #e74791;border-radius:50%;padding:3px;margin-bottom:5px}.ring div{width:100%;height:100%;border-radius:50%;background:#ddd;display:grid;place-items:center;font-size:28px;color:#fff}.feed{height:330px;background:linear-gradient(135deg,#b9c8c5,#d5b9a7 48%,#8b9b9b);display:flex;align-items:center;justify-content:center;font-size:90px}.igbar{display:flex;justify-content:space-around;padding:13px;font-size:24px;border-top:1px solid #eee;position:absolute;bottom:15px;left:0;right:0;background:white}.section{font-size:28px;font-weight:750;padding:15px 20px}.phoneitem{display:flex;align-items:center;padding:15px 19px;border-bottom:1px solid #eee;gap:12px}.initial{width:45px;height:45px;background:linear-gradient(#b2c2e9,#7774b2);border-radius:50%;display:grid;place-items:center;color:white;font-size:21px}.ptext{flex:1}.ptext b{font-size:17px}.ptext div{color:#999;font-size:13px;margin-top:3px}.info{color:#1689ff;font-size:22px}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin:110px auto 25px;max-width:290px}.key{height:72px;width:72px;background:#f5f5f7;border-radius:50%;font-size:34px;margin:auto}.call{background:#61ce68;color:white;width:70px;height:70px;border-radius:50%;font-size:30px;display:block;margin:auto}.navrow{padding:16px 21px;border-bottom:1px solid #eee;font-size:16px}.navrow small{display:block;color:#999;margin-top:6px}.topback{padding:7px 17px;color:#1687f5}.photo{margin:20px;background:linear-gradient(135deg,#c8c6da,#e4d0bd);border-radius:14px;height:220px;display:grid;place-items:center;font-size:65px}.foot{font-size:12px;color:#aaa;text-align:center;padding:14px}.error{background:#ffe1e1;padding:12px;color:#a00;font-size:13px;white-space:pre-wrap}.tiny{font-size:12px;color:#888}.memo{background:#fff7d8;border-radius:12px;padding:18px;margin:15px;font-size:16px;line-height:1.7}.setting{p </style></head><body><main class="phone"><div class="status"><span id="clock">3:54</span><div class="island"></div><div class="status-right"><span style="font-size:15px">▂▄▆</span><svg class="wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M2 8c6-6 14-6 20 0M6 12c4-4 8-4 12 0M10 16c1.5-1.5 2.5-1.5 4 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg><span class="battery"><b></b></span></div></div><section class="screen wall" id="screen"><div class="lockdate">10월 25일 일요일</div><div class="lockclock">3:54</div><div class="locknote">💬 알림 2개<br><b>김운학</b> · 새로운 메시지<br><b>김동현</b> · 내일 시간 있어?</div><button class="unlock" data-go="home">화면을 눌러 잠금 해제 ↑</button></section><button class="bar" data-go="home" aria-label="홈으로"></button></main><script>
(function(){'use strict';
var screen=document.getElementById('screen');var state={page:'lock',choice:'',from:''};try{state.choice=localStorage.getItem('romance_choice')||''}catch(e){}
var icons=[['카카오톡','kakao','TALK','#ffe500'],['Instagram','instagram','◎','linear-gradient(40deg,#ffc350,#e83778,#753bd1)'],['사진','photos','🌼','#f5f5f5'],['전화','phone','☎','#50d768'],['네이버','naver','N','#12c75a'],['메모','memo','▤','#ffcc38'],['설정','settings','⚙','#999'],['카메라','camera','📷','#777']];
function appIcon(a){return '<button class="app" data-go="'+a[1]+'"><span class="appicon" style="background:'+a[3]+';color:'+(a[1]==='kakao'||a[1]==='photos'?'#222':'white')+'">'+a[2]+'</span>'+a[0]+'</button>'}
function tabs(items){return '<div class="tabs">'+items.map(function(i){return '<button data-go="'+i[1]+'">'+i[0]+'<small>'+i[2]+'</small></button>'}).join('')+'</div>'}
function head(name,back){return '<div class="head"><button class="back" data-go="'+(back||'home')+'">‹ 뒤로</button><span style="font-size:18px">'+name+'</span><span>⋯</span></div>'}
function row(name,preview,target,date){return '<button class="chatrow" data-go="'+target+'" style="width:100%;text-align:left"><span class="avatar">'+name[0]+'</span><span class="ctext"><span class="cname">'+name+'</span><div class="sub">'+preview+'</div></span><span class="when">'+(date||'오후 2:47')+'</span></button>'}
function render(page){state.page=page;var h='';var bg='white';
if(page==='lock'){bg='wall';h='<div class="lockdate">10월 25일 일요일</div><div class="lockclock">3:54</div><div class="locknote">💬 알림 2개<br><b>김운학</b> · 새로운 메시지<br><b>김동현</b> · 내일 시간 있어?</div><button class="unlock" data-go="home">위로 밀거나 터치해서 잠금 해제 ↑</button>'}
else if(page==='home'){bg='wall';h='<div class="homeapps">'+icons.map(appIcon).join('')+'</div><div class="dock">'+[['전화','phone','☎','#50d768'],['Safari','naver','🌐','#278cfa'],['카카오톡','kakao','TALK','#ffe500'],['Instagram','instagram','◎','linear-gradient(40deg,#ffc350,#e83778,#753bd1)']].map(appIcon).join('')+'</div>'}
else if(page==='kakao'){h='<div class="head">채팅 <span class="actions">⌕　⊕　⚙</span></div><div class="search">⌕ 검색</div>'+row('김동현','내일 같이 카공할래?','donghyun','오후 3:41')+row('김운학','다현아 내일 시간 있어?','woonhak','오후 3:39')+row('바보들 5','헐 수업 끝','group')+row('엄마','언제 들어와?','mom','어제')+tabs([['♙','home','친구'],['●','kakao','채팅'],['♧','home','오픈채팅'],['•••','settings','더보기']])}
else if(page==='donghyun'||page==='woonhak'){bg='chatbg';var w=page==='woonhak';h=head(w?'김운학':'김동현',w?'instagram':'kakao')+'<div style="text-align:center;color:#657583;font-size:12px;margin:20px">10월 25일 일요일</div><div class="bubble">'+(w?'다현아 ㅎㅎ 내일 시간 있어?\n나랑 데이트할래?':'내일 같이 카공할래?')+'</div>';if(state.choice){h+='<div class="bubble me">'+(state.choice==='woonhak'?(w?'데이트 맞지 ㅎㅎ 좋아 만나자':'아 나 내일은 약속 있어 ㅠㅠ'):(w?'아 내일 카공하기로 했어... 다음에 만나자 운학아 ㅜㅜ 미안':'그랭 ㅎㅎ'))+'</div><div class="bubble">'+(state.choice===(w?'woonhak':'donghyun')?'좋아 ㅎㅎ 내일 보자 ♡':'아쉽다 ㅠㅠ 다음에 보자!')+'</div>'}else{h+='<div style="margin-top:30px;text-align:center;font-size:13px;color:#64758a">답장을 선택해 봐</div>';h+=(w?['데이트 맞지 ㅎㅎ 좋아 만나자','아 내일 카공하기로 했어... 다음에 만나자 운학아 ㅜㅜ 미안']:['그랭 ㅎㅎ','아 나 내일은 약속 있어 ㅠㅠ']).map(function(t,i){return '<button class="choice" data-pick="'+(w?(i===0?'woonhak':'donghyun'):(i===0?'donghyun':'woonhak'))+'">'+t+'</button>'}).join('')}h+='<div class="foot">선택한 답장은 다른 앱에도 반영돼</div>'}
else if(page==='instagram'){h='<div class="instahead"><span>Instagram</span><button data-go="igdm">♡　✉</button></div><div class="stories">'+['내 스토리','woonhak','donghyun','친구'].map(function(n){return '<button class="story" data-go="igdm"><div class="ring"><div>♙</div></div>'+n+'</button>'}).join('')+'</div><div style="padding:15px;border-top:1px solid #eee">◯　<b>woonhak</b></div><div class="feed">☕</div><div style="padding:14px">♡　♡　➤<p><b>woonhak</b> 오늘 날씨 진짜 좋다 ㅎㅎ</p></div><div class="igbar"><button data-go="instagram">⌂</button><button data-go="igdm">⌕</button><button data-go="igdm">✉</button><button data-go="home">◯</button></div>'}
else if(page==='igdm'){h=head('메시지','instagram')+'<div class="search">⌕ 검색</div>'+row('김운학','다현아 ㅎㅎ 내일 시간 있어?','woonhak','지금')+row('김동현','스토리에 답장했습니다','donghyun','어제')}
else if(page==='phone'){h='<div class="section">최근 통화</div>'+[['김운학','오후 12:13'],['안소진','어제'],['김동현','어제'],['엄마','목요일'],['카페 사장님','목요일'],['명재현','수요일']].map(function(a){return '<button class="phoneitem" data-go="contact"><span class="initial">'+a[0][0]+'</span><span class="ptext"><b>'+a[0]+'</b><div>↗ 대한민국</div></span><span class="tiny">'+a[1]+'</span><span class="info">ⓘ</span></button>'}).join('')+tabs([['☆','phone','즐겨찾기'],['◷','phone','최근 통화'],['♙','contact','연락처'],['▦','dial','키패드']])}
else if(page==='dial'){h='<div class="dial">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(function(k){return '<button class="key" data-digit="'+k+'">'+k+'</button>'}).join('')+'</div><div style="text-align:center" id="number"></div><button class="call" data-go="contact">☎</button>'+tabs([['☆','phone','즐겨찾기'],['◷','phone','최근 통화'],['♙','contact','연락처'],['▦','dial','키패드']])}
else if(page==='contact'){h=head('연락처','phone')+['김운학','김동현','엄마','명재현'].map(function(n){return '<div class="phoneitem"><span class="initial">'+n[0]+'</span><b>'+n+'</b></div>'}).join('')}
else if(page==='naver'){h=head('NAVER','home')+'<div class="search">⌕ 검색 또는 웹사이트 이름 입력</div><div class="section">최근 검색어</div>'+['썸남 심리','알바 같이하는 사람과 썸','ENFP 남자','남자의 호감 행동'].map(function(t,i){return '<button class="navrow" data-go="'+(i===0?'searchresult':'naver')+'" style="display:block;width:100%;text-align:left">⌕　'+t+'</button>'}).join('')}
else if(page==='searchresult'){h=head('썸남 심리','naver')+'<div class="section">썸남이 보내는 호감 신호</div><div class="navrow">관심 있는 사람에게 먼저 연락하고, 둘만의 약속을 잡으려는 행동은 호감의 신호일 수 있어요.</div><div class="navrow">하지만 가장 중요한 건 상대의 말과 행동을 함께 보는 거예요.</div>'}
else if(page==='memo'){h=head('메모','home')+'<div class="section">메모</div><div class="memo">내일 뭐 입지…<br>운학이가 갑자기 데이트하자고 했다.<br>근데 동현이도 카공하자고 하고…<br><br>어떡하지? ♡</div>'}
else if(page==='photos'||page==='camera'){h=head('사진','home')+'<div class="section">최근 항목</div><div class="photo">🌷</div><div class="photo">☁️</div>'}
else if(page==='settings'){h=head('설정','home')+'<div class="setting">너에게 닿는 밤</div><div class="setting">iPhone 시뮬레이션</div><button class="choice" data-reset="1">처음부터 다시 시작하기</button>'}
else if(page==='group'||page==='mom'){h=head(page==='mom'?'엄마':'바보들 5','kakao')+'<div class="bubble">'+(page==='mom'?'언제 들어와?':'헐 수업 끝')+'</div>'}
else{h=head('홈','home')}
screen.className='screen '+bg;screen.innerHTML=h;screen.scrollTop=0;}
document.addEventListener('click',function(e){var el=e.target.closest('[data-go],[data-pick],[data-reset],[data-digit]');if(!el)return;if(el.dataset.go){render(el.dataset.go)}else if(el.dataset.pick){state.choice=el.dataset.pick;try{localStorage.setItem('romance_choice',state.choice)}catch(x){}render(state.page)}else if(el.dataset.reset){state.choice='';try{localStorage.removeItem('romance_choice')}catch(x){}render('lock')}else if(el.dataset.digit){var n=document.getElementById('number');if(n)n.textContent+=el.dataset.digit}});
var startY=0;screen.addEventListener('touchstart',function(e){startY=e.touches[0].clientY},{passive:true});screen.addEventListener('touchend',function(e){if(state.page==='lock'&&startY-e.changedTouches[0].clientY>50)render('home')},{passive:true});
window.addEventListener('error',function(e){var box=document.createElement('div');box.className='error';box.textContent='실행 오류: '+e.message;screen.prepend(box)});
render('lock');
})();
</script></body></html>
